- id: case-2007
  source: { video: w9vBVPCH69Q, t: "9:57" }
  scope:
    component: button
    platform: mobile
    size: any
    variant: any
    context: list
  property: touch-target
  direction: up
  problem: "카테고리나 검색 결과, 실시간 검색어 같은 텍스트형 버튼에서 폰트를 너무 깨알같이 작게 쓰면 가독성이 떨어지고, 클릭할 때 손가락 두께를 고려하지 않아 바로 아래 항목과 같이 눌리는 경우가 생긴다."
  fix: "모바일 디자인에서 폰트는 잘 보이고 어느 정도 크기·부피감을 갖도록 쓴다. PC 화면만 보지 말고 핸드폰으로 직접 확인하면서 크기를 조정한다."
  rationale: "설정에서 폰트를 키우는 기능에만 의존하면 이미 큰 타이틀은 더 커지고 작은 텍스트만 적당해져 밸런스가 무너지므로, 애초에 기본값 자체를 적정한 크기로 설정해 두는 것이 가장 좋다."
  stance: OPTION
  quote: "텍스트형 버튼에서 폰트를 너무 깨 같이 쓰기 때문에 가독성도 많이 떨어지고 클릭을 할 때 밑에 것과 같이 눌리거나 우리가 손가락 두께를 전혀 고려하지 않고 디자인을 해 주시는 분들이 굉장히 많습니다."
  qualities: []
  evidence: .evidence/w9vBVPCH69Q/952.png
