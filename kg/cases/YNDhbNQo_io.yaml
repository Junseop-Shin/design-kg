  scope:
    component: list
    platform: mobile
    size: any
    variant: any
    context: list
  property: whitespace
  direction: up
  problem: "쇼핑몰 상품 썸네일이 1단·2단·3단으로 쭉쭉 나열될 때 각 썸네일 단 사이의 여백이 너무 촘촘하면 상품명과 가격이 위 상품 것인지 아래 상품 것인지 그룹핑이 전혀 되어 보이지 않는다."
  fix: "1단과 2단 썸네일 사이의 여백 값을 충분히 확보해 준다."
  rationale: "정지 화면으로 볼 때는 좁아도 인지가 되는 것 같아도, 실제로 스크롤하며 빠르게 훑어볼 때는 전혀 인지가 되지 않는다. 고객의 스크롤 패턴이나 UX 흐름까지 고려해야 한다."
  stance: PREFERRED
  quote: "그래서 이런 문제를 해결하기 위해서 위에 1단과 2단의 썸네일을 넓이 여백 값을 충분히 확보를 해주시는게 좋습니다."
  qualities: []
  evidence: .evidence/YNDhbNQo_io/530.png

