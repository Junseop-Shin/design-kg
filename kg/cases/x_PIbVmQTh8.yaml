    context: form
  property: structure
  direction: other
  problem: "제목+내용 / 제목 / 내용 중 하나만 골라야 하는 항목인데 체크박스(다중 선택용) 스타일로 되어 있다."
  fix: "이 항목은 체크박스가 아니라 라디오 버튼으로 바꾼다. 체크박스는 중복 선택, 라디오 버튼은 하나만 선택하는 용도다."
  rationale: "내용을 보면 하나만 선택하는 항목인데 체크박스를 썼다. 체크박스는 중복으로 여러 개를 선택하는 것이고 라디오 버튼은 이 중 하나를 선택하는 것이다"
  stance: PRESCRIPTIVE
  quote: "아니지 이게 무조건 라디오 버튼 지퍼"
  qualities: []
  evidence: .evidence/x_PIbVmQTh8/1335.png

