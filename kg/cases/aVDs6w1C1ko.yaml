  problem: "카드 안에서 폰트 사이즈가 14px인 텍스트와 18px인 텍스트 사이의 여백을 얼마로 둘지 기준이 없으면, 폰트 사이즈가 32px처럼 커졌을 때도 그대로 같은 여백만 떼도 되는지 판단하기 어렵다."
  fix: "폰트 사이즈 14~18px 구간에서는 여백을 8px로 잡는다. 폰트 사이즈가 커지면(예: 32px) 8px만으로는 좁아 보일 수 있으므로 여백도 그에 맞게 늘려 잡는다."
  rationale: ""
  stance: OPTION
  quote: "자 예를 들어서 여기 폰트 사이즈가 14에 지금 여기 폰트 사이즈는 18입니다 그럼 여백은 몇이야 8이 여기 만약에 폰트가 사이즈가 32하 이렇게 됐어 그럼 8만 떼서 될까 좁아 보이지 않을까 뭐 이런 생각을 하게 되는 거예요."
  qualities: []
  measured: { prop: spacing, value: 8, unit: px }
