- id: case-011
  source: { video: CYhJxtcL5B0, t: "10:38" }
  scope:
    component: nav
    platform: web
    size: any
    variant: any
    context: nav
  property: hierarchy
  direction: other
  problem: "필터를 상단에 둘지 좌측에 둘지가 정해지지 않았다. 상단형은 화면을 넓게 쓸 수 있지만 필터와 상품을 같이 보기 어렵고, 좌측형은 같이 볼 수 있지만 상품 영역이 좁아진다."
  fix: "커머스 사이트 성격에 따라 상단형(검색 후 내려보며 탐색)이나 좌측형(필터를 계속 보며 적용) 중 하나를 고른다. 패션 계열은 화면을 넓게 쓰기 위해 상단형을 쓰는 경우가 많다."
  rationale: "위에 있다고 단점은 아니다. 사용 패턴이 검색 후 내려가며 브랜드·가격·사이즈를 고르는 방식이면 상단형도 괜찮다"
  stance: OPTION
  quote: "이거는 이제이 커머스 사이트 성격에 따라서 어떤 전략을 가져가냐에 따라 다른 거예요."
  qualities: []
  evidence: .evidence/CYhJxtcL5B0/1038.png

