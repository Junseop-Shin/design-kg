  rationale: "패널이 배경을 가리는 건 바탕(상품)은 신경 쓰지 말고 옵션부터 고르라는 개념인데, 지금은 패널 내부 스크롤이 없어 그 개념 자체가 작동하지 않는다"
  stance: PRESCRIPTIVE
  quote: "그러니까이 안에서 스크롤이 생성이 돼야 되는 거예요."
  qualities: []
  evidence: .evidence/CYhJxtcL5B0/947.png
