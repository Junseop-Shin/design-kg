- id: case-015
  source: { video: CYhJxtcL5B0, t: "8:01" }
  scope:
    component: modal
    platform: web
    size: any
    variant: any
    context: modal
  property: interaction
  direction: other
  problem: "필터 오버레이 패널 안에서 옵션(성별·컬렉션·색상 등)을 여러 개 선택해도, 그 선택을 상품 목록에 반영해서 오버레이를 닫는 액션 버튼이 패널 하단에 없다."
  fix: "옵션을 다 고른 뒤 누르는 '적용' 버튼을 패널 하단에 둔다. 이 버튼을 누르면 오버레이가 닫히고 상품 목록이 선택한 조건으로 갱신된다."
  rationale: "필터를 레이어로 덮는다는 건 바탕(상품)은 신경 쓰지 말고 옵션부터 고르라는 개념이라, 옵션 선택을 끝내고 반영하는 액션이 명시적으로 있어야 한다"
  stance: PRESCRIPTIVE
  quote: "그러면 여기에서 지금 뭐가 있어야 되냐면 옵션을 누른 다음에 밑에 뭔가 적용 버튼이 있어야 돼요."
  qualities: []
  evidence: .evidence/CYhJxtcL5B0/801.png

