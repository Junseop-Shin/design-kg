  source: { video: CYhJxtcL5B0, t: "9:43" }
  scope:
    component: modal
    platform: web
    size: any
    variant: any
    context: modal
  property: interaction
  direction: other
  problem: "필터 오버레이 패널을 열고 안의 옵션 목록을 내리면, 패널 내부가 아니라 배경 페이지 전체가 같이 스크롤된다. 패널이 화면 끝까지 다 올라간 뒤에야 비로소 배경이 스크롤되기 시작해, 패널과 배경 중 지금 무엇이 움직이는지 알 수 없다."
