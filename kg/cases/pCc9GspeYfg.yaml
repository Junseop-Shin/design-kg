  fix: "오브젝트 개수가 아니라 메인과 서브의 관계를 명확하게 설계하는 것이 중요하며, 메인 오브젝트를 중심으로 서브 오브젝트의 크기·위치·높이에 차이를 줘 삼각형(트라이앵글) 구도를 만드는 방법이 가장 안정적이다."
  rationale: "삼각형의 흐름을 만들면 자연스럽게 시각적 위계가 형성되고 사용자의 시선을 메인 오브젝트로 유도할 수 있다."
  stance: OPTION
  quote: "가장 안정적으로 활용할 수 있는 방법 중 하나가 바로 플라이앵글이 삼각형 구도입니다."
  qualities: ["불분명한→명확한"]
