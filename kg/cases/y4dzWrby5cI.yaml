- id: case-306
  source: { video: y4dzWrby5cI, t: "9:30" }
  scope:
    component: card
    platform: web
    size: any
    variant: any
    context: any
  property: shadow
  direction: other
  problem: "히어로 이미지, Best Sellers 카드, Product Details 카드 등이 전체적으로 비슷한 높낮이(입체감)로 평평하게 놓여 있어 카드 간 계층이 약하다."
  fix: "어차피 실제 화면이 아니라 JPG로 들어가는 컨셉 보드이므로, 눌릴 요소는 확실히 누르고 띄울 요소는 확실히 띄워 높낮이 계층을 과감하게 잡는다."
  rationale: "컨셉 보드는 실제 사용성과 무관하게 JPG 한 장으로 들어가는 것이므로 디자인 스타일을 과감하게 잡아도 된다"
  stance: OPTION
  quote: "이게 디자인 스타일을 조금 더 과감하게 잡아 줘도 될 거 같아. 지금 전체적으로 카드 디자인이거든, 이거. 약간 바닥에 눌릴 거는 좀 확실하게 눌러 주고 띄울 거는 좀 확실하게 띄우고 해서 높낮지에 대한 계층을 조금 확실하게 잡아 주시는 것도 하나의 포인트인 것 같다."
  qualities: ["?→과감한"]
  evidence: .evidence/y4dzWrby5cI/930.png

- id: case-307
  source: { video: y4dzWrby5cI, t: "13:20" }
  scope:
    component: typo
    platform: web
    size: any
    variant: any
    context: any
  property: hierarchy
  direction: down
  problem: "히어로 이미지의 메인 타이틀('Radiance Renewal Botanical Serum')은 굉장히 크게 키운 반면, 그 옆 코너의 카드형 정보(Best Sellers, Product Details 등) 타이틀은 아직 비슷한 굵기·크기로 남아 있어 전체가 다 세 보인다."
  fix: "코너 쪽 타이틀들은 사이즈를 조금씩 줄이고 굵기(볼드)를 레귤러로 낮춰 힘을 뺀다."
  rationale: "시각적 포인트라 해도 전체를 다 세게 잡으면 다 세져서 깔끔한 느낌이 나지 않는다"
  stance: OPTION
  quote: "당연히 이미지 쪽은 타이틀을 굉장히 키웠지만 그 옆에 코너부터는 타이틀 사이즈를 조금씩 줄이고 힘을 좀 뺄게요. 제가 항상 말하지만 이게 뭐 아무리 시각적인 포인트라고 해도 사용성 상관없다고 해도 전체를 세게 하면 다 세지니까 안 그러면 이게 깔끔한 느낌이 안 날 거 같은데 사이즈 줄이고 레귤러로 바꿨습니다."
  qualities: ["?→깔끔한"]
  evidence: .evidence/y4dzWrby5cI/930.png
